<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Song Request Dock</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #10141f;
    --panel: #171d2c;
    --panel-alt: #1d2436;
    --border: #2a3350;
    --accent: #4da3ff;
    --accent-dim: #2c517e;
    --text: #e8ecf5;
    --text-dim: #8b93a8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif; font-size: 14px;
  }
  body { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 15px;
  }
  header .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #444; flex-shrink: 0;
  }
  header .status-dot.connected { background: #3ddc84; }

  #now-playing {
    padding: 14px;
  }
  #thumb-wrap {
    position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 8px;
    overflow: hidden; background: var(--panel-alt);
  }
  #thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #now-title {
    position: absolute; left: 10px; right: 10px; bottom: 10px;
    font-weight: 600; font-size: 15px; line-height: 1.3;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  #now-meta {
    margin-top: 8px; color: var(--text-dim); font-size: 12px;
  }
  #idle-now-playing {
    display: flex; align-items: center; justify-content: center;
    aspect-ratio: 16/9; border-radius: 8px; background: var(--panel-alt);
    color: var(--text-dim); text-align: center; padding: 12px;
  }

  #controls {
    display: flex; align-items: center; justify-content: center; gap: 22px;
    padding: 14px 0 6px;
  }
  #controls button {
    background: none; border: none; color: var(--text); cursor: pointer;
    width: 40px; height: 40px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; transition: background 0.15s;
  }
  #controls button:hover { background: var(--panel-alt); }
  #controls svg { width: 20px; height: 20px; fill: currentColor; }
  #play-pause-btn { color: var(--accent); }
  #play-pause-btn svg { width: 26px; height: 26px; }

  #show-on-stream {
    display: block; margin: 4px auto 14px; padding: 7px 18px;
    border-radius: 999px; border: 1px solid var(--accent);
    background: transparent; color: var(--accent); font-weight: 600;
    font-size: 12px; letter-spacing: 0.03em; cursor: pointer;
  }
  #show-on-stream.on { background: var(--accent); color: #0a0f1a; }

  #queue-section {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
    border-top: 1px solid var(--border);
  }
  #queue-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px 8px; font-weight: 600; color: var(--accent);
  }
  #queue-header button {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    padding: 4px; border-radius: 4px;
  }
  #queue-header button:hover { color: var(--text); background: var(--panel-alt); }

  #add-form { display: flex; gap: 6px; padding: 0 14px 10px; }
  #add-input {
    flex: 1; background: var(--panel-alt); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; color: var(--text); font-size: 13px;
  }
  #add-input:focus { outline: none; border-color: var(--accent); }
  #add-form button {
    background: var(--accent-dim); border: none; border-radius: 6px;
    color: var(--text); padding: 0 14px; cursor: pointer;
  }
  #add-form button:hover { background: var(--accent); color: #0a0f1a; }

  #queue-list { flex: 1; overflow-y: auto; padding: 0 8px 10px; }
  #queue-empty {
    color: var(--text-dim); text-align: center; padding: 24px 20px; font-size: 13px;
  }
  .queue-item {
    display: flex; align-items: center; gap: 10px; padding: 7px 6px;
    border-radius: 6px;
  }
  .queue-item:hover { background: var(--panel-alt); }
  .queue-item img {
    width: 48px; height: 27px; object-fit: cover; border-radius: 4px; flex-shrink: 0;
  }
  .queue-item .info { flex: 1; min-width: 0; }
  .queue-item .title {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px;
  }
  .queue-item .requester { color: var(--text-dim); font-size: 11px; }
  .queue-item .remove-btn {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 4px 6px; border-radius: 4px; flex-shrink: 0;
  }
  .queue-item .remove-btn:hover { color: #ff6161; background: var(--panel-alt); }
</style>
</head>
<body>

<header>
  <span class="status-dot" id="status-dot"></span>
  Song Request Dock
</header>

<div id="now-playing"></div>

<div id="controls">
  <button id="mute-btn" title="Mute/Unmute">
    <svg viewBox="0 0 24 24"><path id="mute-icon-path" d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
  </button>
  <button id="restart-btn" title="Restart song">
    <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
  </button>
  <button id="play-pause-btn" title="Play/Pause">
    <svg id="play-pause-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <button id="skip-btn" title="Skip to next">
    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
  </button>
</div>

<button id="show-on-stream">Show on Stream</button>

<div id="queue-section">
  <div id="queue-header">
    <span>Playing Queue</span>
    <button id="clear-btn" title="Clear queue">Clear</button>
  </div>
  <form id="add-form">
    <input id="add-input" type="text" placeholder="Enter YouTube URL or search terms" autocomplete="off">
    <button type="submit">Add</button>
  </form>
  <div id="queue-list"></div>
</div>

<script>
  let ws = null;
  let latestState = null;

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function formatDuration(secs) {
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function render(state) {
    latestState = state;

    // Now playing
    const npEl = document.getElementById('now-playing');
    if (state.nowPlaying) {
      const np = state.nowPlaying;
      npEl.innerHTML = `
        <div id="thumb-wrap">
          <img src="${escapeHtml(np.thumbnailUrl)}" alt="">
          <div id="now-title">${escapeHtml(np.title)}</div>
        </div>
        <div id="now-meta">Requested by ${escapeHtml(np.requestedBy)} · ${formatDuration(np.durationSecs)}</div>
      `;
    } else {
      npEl.innerHTML = `<div id="idle-now-playing">Nothing playing — add a song below</div>`;
    }

    // Play/pause icon
    const playPauseIcon = document.getElementById('play-pause-icon');
    playPauseIcon.setAttribute('d', state.playerState === 'playing'
      ? 'M6 5h4v14H6zM14 5h4v14h-4z'   // pause icon
      : 'M8 5v14l11-7z');              // play icon

    // Mute icon
    const muteIconPath = document.getElementById('mute-icon-path');
    muteIconPath.setAttribute('d', state.muted
      ? 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.94 8.94 0 003.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z'
      : 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z');

    // Show on stream toggle
    const showBtn = document.getElementById('show-on-stream');
    showBtn.classList.toggle('on', state.showOnStream);

    // Queue list
    const listEl = document.getElementById('queue-list');
    if (state.queue.length === 0) {
      listEl.innerHTML = `<div id="queue-empty">Queue is empty</div>`;
    } else {
      listEl.innerHTML = state.queue.map(song => `
        <div class="queue-item" data-video-id="${escapeHtml(song.videoId)}">
          <img src="${escapeHtml(song.thumbnailUrl)}" alt="">
          <div class="info">
            <div class="title">${escapeHtml(song.title)}</div>
            <div class="requester">${escapeHtml(song.requestedBy)} · ${formatDuration(song.durationSecs)}</div>
          </div>
          <button class="remove-btn" data-video-id="${escapeHtml(song.videoId)}" title="Remove">&times;</button>
        </div>
      `).join('');
    }
  }

  function send(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => document.getElementById('status-dot').classList.add('connected');
    ws.onclose = () => {
      document.getElementById('status-dot').classList.remove('connected');
      setTimeout(connect, 2000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'state') render(msg);
    };
  }

  document.getElementById('mute-btn').addEventListener('click', () => {
    if (!latestState) return;
    send({ type: 'command', action: latestState.muted ? 'unmute' : 'mute' });
  });

  document.getElementById('restart-btn').addEventListener('click', () => {
    send({ type: 'command', action: 'restart' });
  });

  document.getElementById('play-pause-btn').addEventListener('click', () => {
    if (!latestState) return;
    send({ type: 'command', action: latestState.playerState === 'playing' ? 'pause' : 'play' });
  });

  document.getElementById('skip-btn').addEventListener('click', () => {
    send({ type: 'skip' });
  });

  document.getElementById('show-on-stream').addEventListener('click', () => {
    send({ type: 'toggleShowOnStream' });
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    send({ type: 'clear' });
  });

  document.getElementById('add-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('add-input');
    const query = input.value.trim();
    if (!query) return;
    send({ type: 'add', query });
    input.value = '';
  });

  document.getElementById('queue-list').addEventListener('click', (e) => {
    const btn = e.target.closest('.remove-btn');
    if (!btn) return;
    send({ type: 'remove', videoId: btn.dataset.videoId });
  });

  connect();
</script>
</body>
</html>
