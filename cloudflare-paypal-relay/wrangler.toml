name = "young-hall-6c35"
main = "worker.js"
compatibility_date = "2026-07-24"

# Matches the live dashboard-created Worker (checked 2026-09-26 with
# `wrangler versions view`). workers.dev MUST stay on: PayPal's live webhook
# posts to https://young-hall-6c35.parnold-id.workers.dev/paypal-webhook,
# and wrangler turns workers.dev off when `routes` is set unless told otherwise.
workers_dev = true

# The live binding: the account's only KV namespace, titled "FEED_KV".
# Relay keys are prefixed tip: / seen:.
kv_namespaces = [
  { binding = "TIPS_KV", id = "647f95da1e9248828af1555904d258c1" }
]

# Serves lokati.net/tip's /api/tip/order and /api/tip/capture on the site's
# own origin (same pattern as lokati-feed-cache's lokati.net/api/feed*).
# Needs this Worker in the same Cloudflare account as the lokati.net zone.
routes = [
  { pattern = "lokati.net/api/tip*", zone_name = "lokati.net" }
]

# The live Worker has no plain-text vars: PAYPAL_API_BASE is unset, so the
# Live API default in worker.js applies. Secrets (all four already set on
# the live Worker) are NOT set here — set them with:
#   wrangler secret put PAYPAL_CLIENT_ID
#   wrangler secret put PAYPAL_CLIENT_SECRET
#   wrangler secret put PAYPAL_WEBHOOK_ID
#   wrangler secret put RELAY_TOKEN
