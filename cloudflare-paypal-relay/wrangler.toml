name = "lokati-paypal-relay"
main = "worker.js"
compatibility_date = "2024-01-01"

# Create with: wrangler kv namespace create TIPS_KV
# then paste the printed id below.
kv_namespaces = [
  { binding = "TIPS_KV", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

# Serves lokati.net/tip's /api/tip/order and /api/tip/capture on the site's
# own origin (same pattern as lokati-feed-cache's lokati.net/api/feed*).
# Needs this Worker in the same Cloudflare account as the lokati.net zone.
routes = [
  { pattern = "lokati.net/api/tip*", zone_name = "lokati.net" }
]

# Secrets are NOT set here — set them with:
#   wrangler secret put PAYPAL_CLIENT_ID
#   wrangler secret put PAYPAL_CLIENT_SECRET
#   wrangler secret put PAYPAL_WEBHOOK_ID
#   wrangler secret put RELAY_TOKEN
