[workspace]
members = ["game"]

[package]
name = "twitch-bot-rs"
version = "0.1.0"
edition = "2021"
default-run = "twitch-bot-rs"

[[bin]]
name = "twitch-bot-rs"
path = "src/main.rs"

[[bin]]
name = "auth"
path = "src/bin/auth.rs"

[[bin]]
name = "auth_patreon"
path = "src/bin/auth_patreon.rs"

[dependencies]
game = { path = "game" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rand = "0.8"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
open = "5"
urlencoding = "2"
url = "2"
twitch-irc = { version = "5", features = ["refreshing-token-rustls-webpki-roots"] }
rust_socketio = { version = "0.6", features = ["async"] }
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
sha2 = "0.10"
base64 = "0.22"
zstd = "0.13"
pulldown-cmark = "0.12"
minijinja = { version = "2", features = ["loader"] }
minijinja-autoreload = "2"
flate2 = "1"
