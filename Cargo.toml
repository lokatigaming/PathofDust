# VIRTUAL workspace manifest - no `[package]` of its own (2026-09-08).
#
# The Twitch bot used to BE this file's package, with `game` as its only
# member, which made the bot the repo's apparent primary product and the
# game a subcrate of it. That has been backwards since the 2026-08-22
# build-time decoupling and doubly so since the game moved to Linux as
# the `pathofdust` service while the bot stayed on Windows. Both crates
# are now plain members and neither is the root.
#
# WHY ONE WORKSPACE AND NOT TWO REPOSITORIES. The crates already share no
# dependency, no import, no env key, no port and no file, so separate
# repos would cost two checkouts and two histories to decouple things
# that are already decoupled. The argument that actually decides it is a
# testing one: house rules require `cargo test --release --workspace`,
# and the 2026-08-22 regression (a `TunablesForm` field with no
# `#[serde(default)]`) got past a green "581 passed" report precisely
# because a run did not span the whole workspace. One workspace keeps one
# `--workspace` invocation covering both crates. Splitting the repo would
# make that gap permanent.
#
# `resolver = "2"` is EXPLICIT and must stay. A virtual manifest defaults
# to resolver 1 no matter what edition its members declare, whereas the
# previous root was a 2021-edition package and therefore got resolver 2
# implicitly. Omitting this line would silently change feature unification
# across the whole workspace as a side effect of a directory move.
[workspace]
members = ["bot", "game"]
resolver = "2"
