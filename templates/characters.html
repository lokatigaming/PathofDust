{{ top_nav }}<div class="card"><h1>Adventure Roster</h1></div>{% if empty %}<div class="card"><p class="muted">Nobody's joined the adventure yet.</p></div>{% else %}<div class="roster-grid">{% for c in cards %}<a class="roster-card" href="/characters/{{ c.login_enc }}"><img class="roster-sprite" src="/sprites/{{ c.sprite }}.png" onerror="this.onerror=null;this.src='/sprites/{{ c.sprite }}.gif'" alt=""><div class="roster-name">{{ c.name }}</div><div class="roster-meta">Level {{ c.level }} {{ c.archetype }}</div><div class="roster-meta">{{ c.wins }}W / {{ c.losses }}L ({{ c.winrate }})</div></a>{% endfor %}</div>{% endif %}
