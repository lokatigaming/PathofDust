<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif">
  <title>Crit damage multiplier vs. crit chance (0-400%), before and after the overcrit curve, at 5000% crit damage</title>
  <!-- Gridlines -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1">
    <line x1="60" y1="278" x2="580" y2="278" />
    <line x1="60" y1="216" x2="580" y2="216" />
    <line x1="60" y1="154" x2="580" y2="154" />
    <line x1="60" y1="92" x2="580" y2="92" />
    <line x1="60" y1="30" x2="580" y2="30" />
  </g>
  <g fill="rgba(232,224,255,0.55)" font-size="12" text-anchor="end">
    <text x="52" y="343">0×</text>
    <text x="52" y="282">20×</text>
    <text x="52" y="220">40×</text>
    <text x="52" y="158">60×</text>
    <text x="52" y="96">80×</text>
    <text x="52" y="34">100×</text>
  </g>
  <!-- Axes -->
  <line x1="60" y1="30" x2="60" y2="340" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
  <line x1="60" y1="340" x2="580" y2="340" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
  <g fill="rgba(232,224,255,0.7)" font-size="12" text-anchor="middle">
    <text x="60" y="358">0%</text>
    <text x="190" y="358">100%</text>
    <text x="320" y="358">200%</text>
    <text x="450" y="358">300%</text>
    <text x="580" y="358">400%</text>
  </g>
  <text x="320" y="382" fill="rgba(232,224,255,0.85)" font-size="13" text-anchor="middle">Crit chance</text>
  <text x="-190" y="20" fill="rgba(232,224,255,0.85)" font-size="13" text-anchor="middle" transform="rotate(-90)">Crit damage multiplier</text>

  <!-- Asymptote reference (after-change ceiling, ~62.25x at 5000% crit damage) -->
  <line x1="60" y1="147.75" x2="580" y2="147.75" stroke="#3987e5" stroke-width="1" stroke-dasharray="4,4" opacity="0.55" />
  <text x="584" y="150.75" fill="#3987e5" font-size="11" opacity="0.85">after: caps ~62.25x</text>

  <!-- Before: unbounded linear growth -->
  <polyline points="60,336.9 190,260.95 320,185 450,109.05 580,33.1"
    fill="none" stroke="#d95926" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />

  <!-- After: overcrit curve - identical to Before through the first 100% crit chance, then diverges -->
  <polyline points="60,336.9 190,260.95 320,203.99 450,185 580,175.51"
    fill="none" stroke="#3987e5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Legend -->
  <g font-size="13">
    <line x1="330" y1="46" x2="356" y2="46" stroke="#d95926" stroke-width="3" />
    <text x="362" y="50" fill="rgba(232,224,255,0.9)">Before (unbounded linear)</text>
    <line x1="330" y1="66" x2="356" y2="66" stroke="#3987e5" stroke-width="3" />
    <text x="362" y="70" fill="rgba(232,224,255,0.9)">After (saturating curve)</text>
  </g>
  <text x="320" y="18" fill="rgba(232,224,255,0.9)" font-size="14" text-anchor="middle" font-weight="bold">Crit Damage: Before vs After (example at 5000% crit damage)</text>
</svg>
