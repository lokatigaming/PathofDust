<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif">
  <title>Crit damage multiplier vs. total crit stacks, before and after the overcrit curve</title>
  <!-- Gridlines (y = multiplier) -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1">
    <line x1="60" y1="292.3" x2="580" y2="292.3" />
    <line x1="60" y1="244.6" x2="580" y2="244.6" />
    <line x1="60" y1="196.9" x2="580" y2="196.9" />
    <line x1="60" y1="149.2" x2="580" y2="149.2" />
    <line x1="60" y1="101.5" x2="580" y2="101.5" />
    <line x1="60" y1="53.8" x2="580" y2="53.8" />
  </g>
  <g fill="rgba(232,224,255,0.55)" font-size="12" text-anchor="end">
    <text x="52" y="296.3">1x</text>
    <text x="52" y="248.6">2x</text>
    <text x="52" y="200.9">3x</text>
    <text x="52" y="153.2">4x</text>
    <text x="52" y="105.5">5x</text>
    <text x="52" y="57.8">6x</text>
  </g>
  <!-- Axes -->
  <line x1="60" y1="30" x2="60" y2="340" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
  <line x1="60" y1="340" x2="580" y2="340" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
  <g fill="rgba(232,224,255,0.7)" font-size="12" text-anchor="middle">
    <text x="60" y="358">0</text>
    <text x="164" y="358">2</text>
    <text x="268" y="358">4</text>
    <text x="372" y="358">6</text>
    <text x="476" y="358">8</text>
    <text x="580" y="358">10</text>
  </g>
  <text x="320" y="382" fill="rgba(232,224,255,0.85)" font-size="13" text-anchor="middle">Total crit stacks (100% crit chance = 1 stack)</text>
  <text x="-190" y="20" fill="rgba(232,224,255,0.85)" font-size="13" text-anchor="middle" transform="rotate(-90)">Crit damage multiplier</text>

  <!-- Asymptote reference (after-change ceiling, ~2.25x at crit_multiplier=2.0x) -->
  <line x1="60" y1="232.7" x2="580" y2="232.7" stroke="#b98bff" stroke-width="1" stroke-dasharray="4,4" opacity="0.55" />
  <text x="584" y="230" fill="#b98bff" font-size="11" opacity="0.85">after: caps ~2.25x</text>

  <!-- Before: unbounded linear growth -->
  <polyline points="60,292.3 112,268.5 164,244.6 216,220.8 268,196.9 320,173.1 372,149.2 424,125.4 476,101.5 528,77.7 580,53.8"
    fill="none" stroke="#ff6b6b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />

  <!-- After: overcrit curve, saturates -->
  <polyline points="60,292.3 112,268.5 164,250.6 216,244.6 268,241.6 320,239.8 372,238.7 424,237.8 476,237.1 528,236.6 580,236.2"
    fill="none" stroke="#b98bff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Legend -->
  <g font-size="13">
    <line x1="360" y1="46" x2="386" y2="46" stroke="#ff6b6b" stroke-width="3" />
    <text x="392" y="50" fill="rgba(232,224,255,0.9)">Before (unbounded linear)</text>
    <line x1="360" y1="66" x2="386" y2="66" stroke="#b98bff" stroke-width="3" />
    <text x="392" y="70" fill="rgba(232,224,255,0.9)">After (saturating curve)</text>
  </g>
  <text x="320" y="18" fill="rgba(232,224,255,0.9)" font-size="14" text-anchor="middle" font-weight="bold">Overcrit Damage Multiplier (example at 2.0x crit multiplier)</text>
</svg>
