    // entirely (idle AND any encounter), unlike a downed ghost which
    // still wanders around mid-revive.
    const ids = [...characters.keys()].filter((id) => !characters.get(id).retreated).sort();

    // A basic encounter's enemies need to visibly outsize the party
    // they're fighting, not shrink to fit a fixed footprint the way the
    // old single "boss" sprite budget assumed - each one is sized directly
    // off the CURRENT frame's biggest player sprite (so a high-level
    // roster still faces something imposing, not fixed 90s-era mooks),
    // with a floor for an all-level-1 party. Grid cells deliberately
    // overlap a bit (cellW/rowStep below are less than a full sprite
    // width/height) so a big group reads as a packed crowd instead of
    // sprawling off-screen.
    let enemyDh = 0;
    let enemyCols = 1;
    let enemyRows = 1;
    let enemyCellW = 0;
    let enemyRowStep = 0;
    let enemyFootprintW = 0;
    if (encounter && encounter.kind === 'basic') {
      const maxPlayerDh = ids.length
        ? Math.max(
            ...ids.map((id) => {
              const c = characters.get(id);
              const r = Math.min((12 + Math.min(c.level, 30) * 0.77) * 4, maxRadius) * heroScale;
              return r * 2.2;
            })
          )
        : 90;
      const count = Math.max(1, enemyUnitIds(encounter).length);
      enemyCols = Math.ceil(Math.sqrt(count));
      enemyRows = Math.ceil(count / enemyCols);
      enemyDh = Math.min(canvas.height * 0.62, Math.max(maxPlayerDh * 1.35, 110));
      enemyCellW = enemyDh * bossAspect * 0.72;
      enemyRowStep = enemyDh * 0.4;
      enemyFootprintW = enemyCols * enemyCellW + enemyCellW * 0.3;
    } else if (isMultiBoss) {
      // Same grid mechanics as a basic encounter's group (proven to
      // avoid overlap for N simultaneous enemies), just sized off
      // bossSpriteHeight (huge, boss-scale) instead of the players'
      // own sprite size - a stage-50+ pair of real bosses should still
      // read as dominant, not shrink to basic-mob scale.
      const count = Math.max(1, bossCount);
      enemyCols = Math.ceil(Math.sqrt(count));
      enemyRows = Math.ceil(count / enemyCols);
      enemyDh = bossSpriteHeight;
      enemyCellW = enemyDh * bossAspect * 0.85;
      enemyRowStep = enemyDh * 0.35;
      enemyFootprintW = enemyCols * enemyCellW + enemyCellW * 0.3;
    }

    const leftMargin = Math.max(60, spriteHalfWidth(maxRadius) + 10);
    const rightReserve = Math.max(140, encounter && (encounter.kind === 'basic' || isMultiBoss) ? enemyFootprintW + 60 : bossHalfWidth * 2 + 60);
    const available = Math.max(canvas.width - leftMargin - rightReserve, 100);
    const spacing = Math.min(80, available / Math.max(ids.length, 1));
    const wanderRangeX = Math.max(spacing * 0.9, 40);

    // Every enemy - a lone boss or each member of a basic encounter's
    // group - now leaps/attacks independently via stepEnemyLeap (see its
    // definition, above draw()), called per-enemy in the Pass 1
    // positions loop below. Player formation still anchors off a single
    // point though: a real boss's current leap-tracked position, or (for
    // a whole group) just the static group anchor - individual members
    // roam/leap around that zone rather than the party trying to track
    // each one.
    const bossRestState = encounter && encounter.kind !== 'basic' ? encounter.enemyLeap?.get(BOSS_ID) : undefined;
    const bossEngageX = bossRestState ? bossRestState.restX : bossAnchorX;

    // Role-based battle formation: melee crowds up near the boss, ranged
    // hangs back at range, support holds the middle - a real combat
    // lineup instead of everyone standing shoulder to shoulder like
    // during charge/resolve. Tracks the boss's CURRENT resting spot
    // (it wanders via leaping now, not fixed at the anchor). Seeded once
    // per encounter (not lazily on first read) from the exact position
    // charge left each character at, so the charge -> battle transition
    // eases smoothly into formation instead of snapping from a stale
    // leftover position.
    // All three lanes are gap-offsets from the boss's CURRENT position -
    // not a mix of boss-tracking (melee) and fixed-screen-position
    // (ranged/support) like before. That mismatch was exactly why the
    // formation visibly "collapsed" onto the boss whenever a leap carried
    // it somewhere far off: melee followed it there while ranged/support
    // stayed put, destroying the intended close/mid/far spacing.
    //
    // Clamping each lane independently (an earlier version of this fix)
    // reintroduced the exact same collapse in a different form: whenever
    // the boss was anywhere left-ish (common, since it leaps toward
    // players who start out near leftMargin), both ranged AND support
    // would clamp to the same leftMargin floor and land on top of each
    // other - and since melee's lane sits close to the boss regardless,
    // a boss near the left pulled everyone into one clump again. Instead,
    // the whole formation is anchored as a single unit: if the boss is
    // too close to the left edge to fit the full spread, the anchor (not
    // each lane) shifts right, keeping the 110/300/600 relative spacing
    // intact rather than letting any one lane collapse onto another.
    const meleeGap = 110;
    const fullRangeGap = 600;
    const formationAnchorX = Math.max(leftMargin + fullRangeGap, bossEngageX);
    const meleeLaneX = formationAnchorX - meleeGap;
    const rangedLaneX = formationAnchorX - fullRangeGap;
    const supportLaneX = formationAnchorX - fullRangeGap / 2;
    if (phase && phase.name === 'battle' && encounter && !encounter.formationSeeded) {
      ids.forEach((id, i) => {
        characters.get(id).battleX = leftMargin + i * spacing + 30;
      });
      encounter.formationSeeded = true;
    }

    // Grouped by role so members of the same role fan out across a
    // formation band instead of bunching on a single point. Anyone still
    // on their revive countdown (see isDowned) isn't part of this fight
    // at all - excluded from the formation the same way the server
    // excluded them from combat, not just drawn "downed" within it.
    const roleIds = { melee: [], ranged: [], support: [] };
    ids.forEach((id) => {
      const c = characters.get(id);
      if (isDowned(c, nowEpoch)) return;
      (roleIds[c.role] || roleIds.support).push(id);
    });

    // Pass 1: positions. Needed up front so events firing this frame can
    // aim their effect at where units actually are, not last frame's spot.
    const positions = new Map();
    const isBasicEncounter = !!encounter && encounter.kind === 'basic';
    if (encounter) {
      enemyUnitIds(encounter).forEach((id, i) => {
        // Home slot: where this enemy starts out and falls back to
        // during charge/resolve - the single anchor for a boss, or this
        // particular member's own grid slot for a group (each still
        // roams away from it via leaping during battle - see
        // stepEnemyLeap).
        let homeX, homeY, baseDh;
        if (isBasicEncounter || isMultiBoss) {
          const col = i % enemyCols;
          const row = Math.floor(i / enemyCols);
          const stagger = row % 2 === 1 ? enemyCellW * 0.5 : 0;
          homeX = bossAnchorX - enemyFootprintW / 2 + enemyCellW / 2 + col * enemyCellW + stagger;
          homeY = groundY - (enemyRows - 1 - row) * enemyRowStep;
          baseDh = enemyDh;
        } else {
          homeX = bossAnchorX;
          homeY = groundY;
          baseDh = bossSpriteHeight;
        }

        // Dragon redesign (2026-08-15) - identified by sprite name (the
        // only signal the overlay has; it never learns the real
        // BossKind - see boss_sprites/bossImgAt). A basic encounter's
        // filler mobs never match, and a Lich's summoned adds now fall
        // back to a generic sprite (see spriteNameForEnemySlot) instead
        // of copying boss slot 0, so this can't misfire on either.
        const enemySpriteName = spriteNameForEnemySlot(i);
        const isDragon = !isBasicEncounter && /dragon/i.test(enemySpriteName);
        // Gelatinous Cube (2026-08-17, a live request: "cubes should
        // slide not jump and slam") - same sprite-name identification
        // shape as isDragon above (bosses/cube1 or bosses/cube2, per
        // BossKind::sprite - either frame counts, the crawl doesn't care
        // which is currently showing).
        const isCube = !isBasicEncounter && /cube/i.test(enemySpriteName);
        if (!isBasicEncounter && enemySpriteName === 'death') {
          baseDh *= LICH_SUMMON_SIZE_MULT;
        }

        let x, y, scale, glow, facingLeft;
        if (isCube && phase && phase.name === 'battle') {
          // Ground-bound continuous slide - never enters stepEnemyLeap's
          // rise/hang/slam arc, and never scatters anyone.
          const crawl = updateCubeCrawl(id, homeX, homeY, now);
          x = crawl.x;
          y = crawl.y;
          scale = crawl.scale;
          glow = 0;
          facingLeft = crawl.facingLeft;
        } else if (isDragon) {
          // Floats via updateDragonFlight (see its own doc) instead of
          // stepEnemyLeap's leap-and-slam - never scatters players (that
          // knockback only ever comes from a leap landing, which a
          // hovering/flying Dragon simply never does), and floats
          // through every phase, not just battle. Rendered at half its
          // normal boss size (DRAGON_SIZE_MULT) - it read as too
          // dominant at the standard boss scale.
          baseDh *= DRAGON_SIZE_MULT;
          let s = 1;
          let dropIn = 0;
          if (phase && phase.name === 'charge') {
            s = phase.progress;
            dropIn = (1 - phase.progress) * 120;
          } else if (phase && phase.name === 'resolve' && encounter.won) {
            s = 1 - phase.progress;
          }
          const flight = updateDragonFlight(id, homeX, homeY, now);
          x = flight.x;
          y = flight.y - dropIn;
          scale = s;
          glow = 0;
          facingLeft = flight.facingLeft;
        } else if (phase && phase.name === 'battle') {
          const step = stepEnemyLeap(encounter, id, homeX, homeY, now, groundY, ids, characters, leftMargin);
          x = step.x + Math.sin(now / 20 + 1.3 + i) * 5;
          y = step.y;
          scale = step.scale;
          glow = step.glow;
        } else {
          // Charge (entrance) and resolve (retreat) both just sit at the
          // home slot - only battle actually leaps/roams.
          let s = 1;
          let dropIn = 0;
          if (phase && phase.name === 'charge') {
            s = phase.progress;
            dropIn = (1 - phase.progress) * 120;
          } else if (phase && phase.name === 'resolve' && encounter.won) {
            s = 1 - phase.progress;
          }
          x = homeX;
          y = homeY - dropIn;
          scale = s;
          glow = 0;
        }

        // Clamped against THIS frame's actual rendered half-width/height,
        // not the resting size - a leap grows it up to ~14% bigger at its
        // peak, and clamping against the smaller resting size could still
        // let that larger frame poke past the edge.
        const finalDh = baseDh * Math.max(0, scale);
        const finalHalfW = (finalDh / 2) * bossAspect;
        const clampedX = Math.max(finalHalfW + 4, Math.min(canvas.width - finalHalfW - 4, x));
        const clampedY = Math.max(finalDh + 30, y);
        positions.set(id, { x: clampedX, y: clampedY, radius: finalDh / 2, spriteHeight: finalDh, glow, facingLeft });
      });
    }

    ids.forEach((id, i) => {
      const c = characters.get(id);
      let x, y;
      const ghost = isDowned(c, nowEpoch);

      // On their revive countdown - sits out entirely, in every phase
      // (never a combat participant), but still wanders like a normal
      // idle character rather than standing frozen - just no jumping (see
      // updateWander/updateJump and drawDowned).
      if (ghost) {
        updateWander(c, now, dt, wanderRangeX);
        x = leftMargin + i * spacing + c.wanderX;
        y = groundY - Math.min(c.wanderY, IDLE_MAX_LIFT);
        // Same IDLE_HERO_SCALE cut as a normal idle character - a
        // reviving ghost is still an idle-status sprite, just wandering
        // instead of standing.
        const radius = Math.min((12 + Math.min(c.level, 30) * 0.77) * 4, maxRadius) * IDLE_HERO_SCALE;
        const halfW = spriteHalfWidth(radius);
        x = Math.max(halfW + 4, Math.min(canvas.width - halfW - 4, x));
        positions.set(id, { x, y, radius });
        return;
      }

      const combatUnit = encounter ? encounter.units.get(id) : null;
      const downed = combatUnit ? !combatUnit.alive : false;
      updateFacing(c, now);

      if (!phase && c.flying) {
        updateFlyMotion(c, now, dt, wanderRangeX, c.bobPhase);
        x = leftMargin + i * spacing + c.wanderX;
        y = groundY - FLY_HEIGHT - c.wanderY - c.flyBob;
      } else if (!phase) {
        updateIdleMotion(c, now, dt, wanderRangeX);
        x = leftMargin + i * spacing + c.wanderX;
        // Feet never more than IDLE_MAX_LIFT above the ground line while
        // idle - wanderY alone (+/-15) was already close to that, but
        // jumpOffset on top of it (a real hop, peaking well over 100px
        // for a big jumpVy roll) was pushing idle characters way higher
        // than intended. Horizontal wander/jump timing itself is
        // untouched - only the resulting vertical position gets clamped.
        y = groundY - Math.min(c.wanderY + c.jumpOffset, IDLE_MAX_LIFT);
      } else if (downed) {
        // Stays put, slumped, once knocked out for the rest of the fight.
        x = leftMargin + i * spacing;
        y = groundY;
      } else if (phase.name === 'battle') {
        const laneX = c.role === 'melee' ? meleeLaneX : c.role === 'ranged' ? rangedLaneX : supportLaneX;
        const group = roleIds[c.role] || roleIds.support;
        const roleIndex = group.indexOf(id);
        const groupSize = group.length;
        // Fans same-role characters across a band (instead of a single
        // jittered point) and keeps a continuous, individually-phased
        // sway going even once settled - a moving target rather than a
        // fixed one, so the formation never just freezes in place.
        const spreadWidth = Math.min(300, 48 * groupSize);
        const fanX = groupSize > 1 ? (roleIndex / (groupSize - 1) - 0.5) * spreadWidth : 0;
        const sway = Math.sin(now / 480 + roleIndex * 1.7) * 20;
        const ease = Math.min(dt * 2.5, 1);
        c.battleX += (laneX + fanX + sway - c.battleX) * ease;
        if (c.flying) {
          // Wings of Flight (live request, 2026-08-15) - stays airborne
          // through battle too now, not idle-only (same "apply in every
          // phase" precedent the Dragon's own hover already established -
          // see DRAGON_HOVER_HEIGHT's doc), and immune to the knockback/
          // scatter below entirely - nothing to knock off their feet when
          // they're not standing on any. X still follows the normal
          // melee/ranged/support formation lane above; only bob replaces
          // the ground-relative sway+scatter for Y (same bob formula
          // updateFlyMotion uses, inlined here since that helper's own
          // wander call would fight with battleX-driven positioning).
          c.flyBob = Math.sin(now / 900 + c.bobPhase) * 16;
          x = c.battleX;
          y = groundY - FLY_HEIGHT - c.flyBob;
        } else {
          updateScatter(c, dt);
          x = c.battleX + c.scatterX;
          y = groundY - Math.abs(Math.sin(now / 340 + roleIndex * 1.3)) * 10 - (roleIndex % 2) * 14 - c.scatterY;
        }
      } else if (c.flying) {
        // Charge/resolve phases - same flying override, X keeps the
        // normal rush-in/retreat animation, only Y switches to the fixed
        // hover height instead of a ground hop.
        x = leftMargin + i * spacing + rush;
        c.flyBob = Math.sin(now / 900 + c.bobPhase) * 16;
        y = groundY - FLY_HEIGHT - c.flyBob;
      } else {
        x = leftMargin + i * spacing + rush;
        y = groundY - jump;
      }
      const radius = Math.min((12 + Math.min(c.level, 30) * 0.77) * 4, maxRadius) * heroScale;
      // Hard backstop: whatever the formation/wander/jitter math above
      // landed on, never let the actual drawn sprite hang off either
      // edge of the canvas.
      const halfW = spriteHalfWidth(radius);
      x = Math.max(halfW + 4, Math.min(canvas.width - halfW - 4, x));
      positions.set(id, { x, y, radius });
    });

    // Fire whatever real combat events have now come due, using the
    // positions just computed.
    if (phase && phase.name === 'battle' && encounter) {
      while (encounter.firedIndex < encounter.events.length && encounter.events[encounter.firedIndex].atMs <= phase.battleElapsedMs) {
        fireEvent(encounter.events[encounter.firedIndex], positions);
        encounter.firedIndex++;
      }
    }

    // Ease every combat unit's displayed/ghost HP toward its real value
    // this frame - see updateUnitDisplayHp - before drawing any of them.
    if (encounter) {
      for (const u of encounter.units.values()) updateUnitDisplayHp(u, dt);
    }

    // Pass 2: draw. Boss body first so heroes always render on top of it
    // (melee especially - they crowd right up against it), even when
    // they visually overlap; health bars are collected here and drawn in
    // their own final pass instead of inline, so one can never end up
    // buried under a neighboring sprite in a dense cluster; effects on
    // top of both; the banner over everything.
    const healthBars = [];

    if (phase && encounter) {
      // Each enemy - lone boss or group member alike - is a real,
      // independently-simulated CombatUnit now (see adventure.rs's
      // simulate_battle taking a Vec<BossStats>), drawn and
      // health-barred individually, faded out (not removed - keeps the
      // formation's slots stable) once its own Defeat event fires. Only
      // a real boss gets the "BOSS" label - a basic encounter's rank-and-
      // file don't need one.
      enemyUnitIds(encounter).forEach((id, i) => {
        const unit = encounter.units.get(id);
        const pos = positions.get(id);
        if (!unit || !pos) return;
        const alpha = unit.alive ? 1 : 0.35;
        const label = isBasicEncounter ? null : 'BOSS';
        const spriteName = spriteNameForEnemySlot(i);
        const gifImg = bossGifImgFor(i, spriteName);
        const bar = drawEnemy(pos.x, pos.y, pos.radius, bossImgAt(i), pos.spriteHeight, alpha, label, pos.facingLeft, gifImg);
        if (bar && unit.alive) {
          bar.hpFrac = unit.displayHp / unit.maxHp;
          bar.ghostFrac = unit.ghostHp / unit.maxHp;
          healthBars.push(bar);
        }
      });
    }

    ids.forEach((id) => {
      const c = characters.get(id);
      const pos = positions.get(id);

      const combatUnit = encounter ? encounter.units.get(id) : null;
      const downed = combatUnit ? !combatUnit.alive : false;

      // Two distinct ghost states, both drawn the same way (drawDowned):
      // isDowned (a real, timed revive countdown - see adventure.rs) only
      // starts once the WHOLE encounter that killed them has finished
      // playing out, so it can't preempt their own death animation.
      // `downed` here means THIS fight's replay has already fired their
      // Defeat event - individually, exactly when their own bar hits
      // zero, not all at once - so they go ghost right then too, just at
      // a flat (non-counting-down) alpha since the real 30s timer hasn't
      // started yet.
      // ?highlight=<login> (see its own doc up top) - everyone but the
      // named character gets dimmed, ghost/downed rendering included.
      const dimAlpha = highlightName && id !== highlightName ? HIGHLIGHT_DIM_ALPHA : 1;

      const revivingGhost = isDowned(c, nowEpoch);
      if (revivingGhost || downed) {
        // drawCharacter (which normally positions/hides this) isn't
        // called on this path - hide it directly so a custom-gif
        // character's persistent <img> doesn't keep floating at its last
        // position while drawDowned draws the ghost separately.
        const staleGifImg = characterGifImgs.get(id);
        if (staleGifImg) staleGifImg.style.display = 'none';
        drawDowned(pos.x, pos.y, pos.radius, c.displayName, (revivingGhost ? deathFadeAlpha(c, nowEpoch) : 0.75) * dimAlpha);
        return;
      }

      const hpFrac = combatUnit ? combatUnit.displayHp / combatUnit.maxHp : null;
      const ghostFrac = combatUnit ? combatUnit.ghostHp / combatUnit.maxHp : null;

      let radius = pos.radius;
      if (phase && phase.name === 'resolve' && encounter && encounter.won) {
        radius *= 1 + 0.15 * Math.sin(phase.progress * Math.PI);
      }

      const sprite = spriteForCharacter(id);
      const gifImg = characterGifImgFor(id, sprite);
      const bar = drawCharacter(pos.x, pos.y, radius, sprite, c.color, c.displayName, c.level, hpFrac, ghostFrac, downed, c.facingLeft, gifImg, dimAlpha);
      if (bar) healthBars.push(bar);
    });

    updateAndDrawEffects(now);
    updateAndDrawFlickerDashes(now);
    updateAndDrawDragonBreathShots(now);

    for (const bar of healthBars) {
      drawHealthBar(bar.x, bar.barY, bar.width, bar.height, bar.hpFrac, bar.ghostFrac, bar.label);
    }

    if (phase && phase.name === 'resolve') {
      drawBanner(encounter.won ? 'Victory!' : 'Defeated...', encounter.won ? '#7CFC7C' : '#FF6B6B', phase.progress);
    }

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'state') {
        applyState(msg);
      } else if (msg.type === 'encounter') {
        applyEncounter(msg);
      }
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }

  connect();
</script>
</body>
</html>
